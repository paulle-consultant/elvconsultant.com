name: Maison theme for blog
on:
  push:
    branches: [main]
    paths: ['blog/**.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply luxury theme to blog pages
        run: python3 scripts/maison_blog.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain blog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/
            git commit -m "Blog: auto-apply Maison luxury theme"
            git push
          fi
